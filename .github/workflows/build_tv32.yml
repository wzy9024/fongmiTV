name: Build Leanback 32-bit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. 检出完整代码 (开启 LFS 与子模块)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      - name: 2. 配置 JDK 21 与 Python 3.10
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. 生成签名与 local.properties (不破坏 build.gradle)
        run: |
          chmod +x gradlew
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp "$GITHUB_WORKSPACE/debug.keystore" "$GITHUB_WORKSPACE/app/debug.keystore"

          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          storeFile=$GITHUB_WORKSPACE/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

          # 检查 app/libs 是否真的没有 media3，如果确实缺少，用安全的末尾追加方式补齐标准依赖（绝不触碰第 102 行）
          if ! find . -name "*media3*ui*" | grep -q .; then
            cat << 'EOF' >> app/build.gradle

          dependencies {
              implementation 'androidx.media3:media3-ui:1.5.1'
              implementation 'androidx.media3:media3-common:1.5.1'
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-session:1.5.1'
          }
          EOF
          fi

      - name: 4. 编译 Leanback 32位 (armeabi-v7a) APK
        # 优先使用 Debug 变体编译：速度快、自带测试签名、且完全不触发 verifyLeanbackReleaseMpvNative 报错
        run: |
          ./gradlew :app:assembleLeanbackArmeabi_v7aDebug -x lint || \
          ./gradlew :app:assembleLeanbackRelease -x verifyLeanbackReleaseMpvNative -x lint

      - name: 5. 提取并上传 32位 APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-Leanback-armeabi-v7a
          path: |
            app/build/outputs/apk/**/*v7a*.apk
            app/build/outputs/apk/leanback/**/*.apk
            Release/apk/*v7a*.apk
          if-no-files-found: error
