name: Build Leanback 32-bit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. 检出代码及子模块
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 2. 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. 自动生成 local.properties 并赋予执行权限
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 补充可能被 build.gradle 读取的签名属性防止空指针报错
          echo "KEY_PATH=debug.keystore" >> local.properties
          echo "KEY_ALIAS=androiddebugkey" >> local.properties
          echo "STORE_PASS=android" >> local.properties
          echo "KEY_PASS=android" >> local.properties
          # 自动生成一个通用签名文件放在根目录和 app 目录下备用
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore

      - name: 4. 仅编译 Leanback 32位 (armeabi-v7a) Debug 版
        run: |
          TASK=$(./gradlew :app:tasks --all | grep -iE "assembleLeanback.*(v7a|arm32).*Debug" | head -n 1 | awk '{print $1}')
          if [ -z "$TASK" ]; then
            echo "未匹配到单独的v7a任务名，回退至编译 Leanback Debug..."
            ./gradlew :app:assembleLeanbackDebug
          else
            echo "正在执行编译任务: :app:$TASK"
            ./gradlew ":app:$TASK"
          fi

      - name: 5. 提取并上传 32位 APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-Leanback-armeabi-v7a
          path: |
            app/build/outputs/apk/**/*v7a*.apk
            app/build/outputs/apk/**/*arm32*.apk
            app/build/outputs/apk/leanback/**/*.apk
          if-no-files-found: error
